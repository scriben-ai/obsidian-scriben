# Builds the three files Obsidian installs and attaches them to the tag.
# A release without main.js is one nobody can install manually, which is the
# only route until the community listing lands.
name: Release
on:
  push:
    tags: ['*']
permissions:
  contents: write
  # Artifact attestations let a user cryptographically verify that main.js was
  # built from this source, rather than uploaded by hand. Obsidian's review asks
  # for it, and it is the difference between "trust the author" and "check".
  id-token: write
  attestations: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'main.js, manifest.json, styles.css'
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            main.js
            manifest.json
            styles.css
